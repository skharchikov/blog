<!DOCTYPE html>
<html lang="en" data-theme="skh">
  <head>
    <meta charset="UTF-8">
    <!-- Theme before first paint: a saved choice wins, else follow the OS
         (paper for light, skh for dark). Same rule as tui_core::theme::resolve. -->
    <script>
      (function () {
        var themes = ["skh", "tokyo-night", "gruvbox", "paper"], t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (themes.indexOf(t) < 0) {
          var light = false;
          try { light = matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
          t = light ? "paper" : "skh";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Per-page meta. The prerender build step (Trunk post_build hook) rebuilds
         everything between META:START and META:END for each post/project page.
         Keep these markers; the homepage keeps the default values below. -->
    <!-- META:START -->
    <title>skh — software engineer (Rust, Scala)</title>
    <meta name="title" content="skh — software engineer (Rust, Scala)">
    <meta name="description" content="Notes from a software engineer on Rust, algorithms and the things I build.">
    <link rel="canonical" href="https://skh.rs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://skh.rs">
    <meta property="og:title" content="skh — software engineer (Rust, Scala)">
    <meta property="og:description" content="Notes from a software engineer on Rust, algorithms and the things I build.">
    <meta property="og:site_name" content="skh">
    <meta property="og:image" content="https://skh.rs/computer_7268855.png">
    <!-- META:END -->

    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/computer_7268855.png">
    <link rel="apple-touch-icon" href="/computer_7268855.png">

    <!-- GoatCounter (privacy-friendly view counting). no_onload: this is an SPA, we count manually per post. -->
    <script
      data-goatcounter="https://skh.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>

    <link data-trunk rel="copy-dir" href="public/fonts" />
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link data-trunk rel="rust" data-bin="blog" />
    <link data-trunk rel="css" href="src/styles.css" />
    <link data-trunk rel="copy-file" href="public/robots.txt" />
    <link data-trunk rel="copy-file" href="public/_redirects" />
    <link data-trunk rel="copy-file" href="public/computer_7268855.png" />
    <link data-trunk rel="copy-dir" href="public/sprites" />
  </head>
  <body></body>
</html>
