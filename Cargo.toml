[package]
name = "blog"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "DomTokenList", "HtmlScriptElement", "HtmlIFrameElement", "Node", "MediaQueryList"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }

# Default wasm app binary (Trunk builds this one; see data-bin in index.html).
[[bin]]
name = "blog"
path = "src/main.rs"

# Host-side static-HTML prerenderer, run by the Trunk post_build hook.
# Never built for wasm; invoked explicitly via `cargo run --bin prerender`.
[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"

[build-dependencies]
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
