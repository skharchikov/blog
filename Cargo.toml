[package]
name = "blog"
version = "0.1.0"
edition = "2021"

# Deps shared by the wasm app and the host-side `prerender` bin.
[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

# Host-only deps. Gated off the wasm target so the SPA build never compiles
# them. `serde_yaml` is used by the `prerender` bin to parse frontmatter
# (build.rs has its own copy under [build-dependencies]). The rest are optional
# and pulled in only by the `fetch-books` feature (the `fetch_books` bin, which
# queries Hardcover's GraphQL API to refresh books/library.json).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "default-tls"], optional = true }
serde_json = { version = "1.0", optional = true }
dotenvy = { version = "0.15", optional = true }

# Wasm-only deps for the SPA. Gated to the wasm target so the host-side
# `prerender` bin (run by the Trunk post_build hook) doesn't pull them in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "DomTokenList", "HtmlScriptElement", "HtmlIFrameElement", "Node", "MediaQueryList"] }
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }

# Default wasm app binary (Trunk builds this one; see data-bin in index.html).
[[bin]]
name = "blog"
path = "src/main.rs"

# Host-side static-HTML prerenderer, run by the Trunk post_build hook.
# Never built for wasm. Gated behind the `prerender` feature so the default
# `cargo build` (which targets wasm — see .cargo/config.toml) skips it. Invoked
# on the host via `cargo run --bin prerender --features prerender --target <host>`
# (the Trunk post_build hook passes both; see Trunk.toml).
[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["prerender"]

# Host-side bin that refreshes books/library.json from the Hardcover GraphQL API.
# Never built for wasm. Run on the host via
# `cargo run --bin fetch_books --features fetch-books --target <host>`.
[[bin]]
name = "fetch_books"
path = "src/bin/fetch_books.rs"
required-features = ["fetch-books"]

[features]
# Selects the host-side `prerender` bin. Empty: its host-only deps are already
# target-gated (serde_yaml), so this only controls bin selection.
prerender = []
# Selects the host-side `fetch_books` bin and its network deps. Off by default
# so the wasm SPA build never pulls in reqwest.
fetch-books = ["dep:reqwest", "dep:serde_json", "dep:dotenvy"]

[build-dependencies]
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
