name: Refresh Bookshelf

# Nightly (and on-demand) refresh of books/library.json from the Hardcover API.
# Committing a change to master triggers a Cloudflare Pages redeploy, so the
# bookshelf stays current without shipping the API token to the browser.
on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Allow the job to push the refreshed library back to master.
permissions:
  contents: write

concurrency:
  group: refresh-books
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch library from Hardcover
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          # Explicit host target: the crate defaults to wasm (see
          # .cargo/config.toml), but this bin runs on the host.
          cargo run --release --bin fetch_books --features fetch-books \
            --target x86_64-unknown-linux-gnu

      - name: Commit if changed
        run: |
          if git diff --quiet -- books/library.json; then
            echo "No changes to books/library.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/library.json
          git commit -m "chore: refresh bookshelf from Hardcover"
          git push
